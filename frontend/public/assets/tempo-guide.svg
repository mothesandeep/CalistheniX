<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="100%" height="100%">
  <defs>
    <linearGradient id="tBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e111a"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="tCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1f2e"/>
      <stop offset="100%" stop-color="#121520"/>
    </linearGradient>
    <linearGradient id="tAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="tShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="840" height="460" rx="14" fill="url(#tBgGrad)" stroke="#232838" stroke-width="1.5"/>

  <!-- Diagram Header -->
  <text x="30" y="38" fill="#8b5cf6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5">CALISTHENICS PROTOCOL</text>
  <text x="30" y="58" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Tempo Cadence (3-1-X-1) &amp; Postural Biomechanics</text>

  <!-- Top Tempo Breakdown Bar (4 Digit Notation) -->
  <g transform="translate(25, 76)">
    <!-- Digit 1: Eccentric -->
    <g transform="translate(0, 0)">
      <rect width="185" height="110" rx="8" fill="url(#tCardGrad)" stroke="rgba(139, 92, 246, 0.35)" stroke-width="1.2" filter="url(#tShadow)"/>
      <text x="20" y="38" fill="#c4b5fd" font-family="sans-serif" font-size="32" font-weight="900">3s</text>
      <text x="75" y="28" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">ECCENTRIC</text>
      <text x="75" y="42" fill="#94a3b8" font-family="sans-serif" font-size="10">Lowering Phase</text>
      <text x="20" y="70" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">Builds peak hypertrophic tension &amp; joint elasticity.</text>
      <rect x="20" y="88" width="145" height="4" rx="2" fill="#334155"/>
      <rect x="20" y="88" width="145" height="4" rx="2" fill="#8b5cf6"/>
    </g>

    <!-- Digit 2: Isometric Pause -->
    <g transform="translate(200, 0)">
      <rect width="185" height="110" rx="8" fill="url(#tCardGrad)" stroke="rgba(6, 182, 212, 0.35)" stroke-width="1.2" filter="url(#tShadow)"/>
      <text x="20" y="38" fill="#67e8f9" font-family="sans-serif" font-size="32" font-weight="900">1s</text>
      <text x="75" y="28" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">ISOMETRIC</text>
      <text x="75" y="42" fill="#94a3b8" font-family="sans-serif" font-size="10">Bottom Hover</text>
      <text x="20" y="70" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">Eliminates elastic stretch reflex; isolates muscle fibers.</text>
      <rect x="20" y="88" width="145" height="4" rx="2" fill="#334155"/>
      <rect x="20" y="88" width="55" height="4" rx="2" fill="#06b6d4"/>
    </g>

    <!-- Digit 3: Concentric Explosive -->
    <g transform="translate(400, 0)">
      <rect width="185" height="110" rx="8" fill="url(#tCardGrad)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1.2" filter="url(#tShadow)"/>
      <text x="20" y="38" fill="#a7f3d0" font-family="sans-serif" font-size="32" font-weight="900">X</text>
      <text x="65" y="28" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">CONCENTRIC</text>
      <text x="65" y="42" fill="#94a3b8" font-family="sans-serif" font-size="10">Explosive Push</text>
      <text x="20" y="70" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">Fast-twitch motor unit recruitment &amp; max power.</text>
      <rect x="20" y="88" width="145" height="4" rx="2" fill="#334155"/>
      <rect x="20" y="88" width="40" height="4" rx="2" fill="#10b981"/>
    </g>

    <!-- Digit 4: Lockout Hold -->
    <g transform="translate(600, 0)">
      <rect width="190" height="110" rx="8" fill="url(#tCardGrad)" stroke="rgba(245, 158, 11, 0.35)" stroke-width="1.2" filter="url(#tShadow)"/>
      <text x="20" y="38" fill="#fde68a" font-family="sans-serif" font-size="32" font-weight="900">1s</text>
      <text x="75" y="28" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">LOCKOUT</text>
      <text x="75" y="42" fill="#94a3b8" font-family="sans-serif" font-size="10">Scapula Reset</text>
      <text x="20" y="70" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">Full protraction &amp; mind-muscle contraction peak.</text>
      <rect x="20" y="88" width="150" height="4" rx="2" fill="#334155"/>
      <rect x="20" y="88" width="55" height="4" rx="2" fill="#f59e0b"/>
    </g>
  </g>

  <!-- Bottom Section: Posture Comparison (Strict Form vs Common Pitfalls) -->
  <g transform="translate(25, 205)">
    <!-- Card Left: Strict Neutral Form (CORRECT) -->
    <g transform="translate(0, 0)">
      <rect width="385" height="230" rx="10" fill="url(#tCardGrad)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.2" filter="url(#tShadow)"/>
      
      <rect x="16" y="14" width="80" height="22" rx="4" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1"/>
      <text x="56" y="29" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">✓ OPTIMAL FORM</text>

      <text x="110" y="29" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Neutral Spine &amp; Posterior Pelvic Tilt</text>

      <!-- Vector Visual: Straight Plank -->
      <g transform="translate(20, 50)">
        <line x1="0" y1="90" x2="340" y2="90" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3"/>
        
        <!-- Hands & Toes -->
        <circle cx="50" cy="88" r="4" fill="#10b981"/>
        <circle cx="310" cy="88" r="3" fill="#64748b"/>
        
        <!-- Arms locked -->
        <line x1="50" y1="88" x2="60" y2="35" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
        
        <!-- Head -->
        <circle cx="35" cy="18" r="10" fill="#10b981"/>
        
        <!-- Strict Straight Kinetic Spine (Green laser line) -->
        <line x1="45" y1="25" x2="310" y2="88" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
        <line x1="35" y1="18" x2="320" y2="90" stroke="#a7f3d0" stroke-width="1.5" stroke-dasharray="2 3"/>

        <text x="180" y="42" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="700">180° Rigid Plank Line</text>
      </g>

      <g transform="translate(16, 160)">
        <text x="0" y="10" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">· Transverse abdominis braced &amp; glutes actively clamped</text>
        <text x="0" y="28" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">· Zero spinal hyperextension / zero lower back strain</text>
        <text x="0" y="46" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">· Maximum mechanical lever torque transmitted into chest &amp; arms</text>
      </g>
    </g>

    <!-- Card Right: Compromised Posture Pitfalls (INCORRECT) -->
    <g transform="translate(405, 0)">
      <rect width="385" height="230" rx="10" fill="url(#tCardGrad)" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1.2" filter="url(#tShadow)"/>
      
      <rect x="16" y="14" width="85" height="22" rx="4" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" stroke-width="1"/>
      <text x="58" y="29" fill="#f87171" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">✗ SAGGING FAULT</text>

      <text x="115" y="29" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Lumbar Lordosis &amp; Core Leakage</text>

      <!-- Vector Visual: Sagging Hip Spine -->
      <g transform="translate(20, 50)">
        <line x1="0" y1="90" x2="340" y2="90" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3"/>
        
        <!-- Hands & Toes -->
        <circle cx="50" cy="88" r="4" fill="#ef4444"/>
        <circle cx="310" cy="88" r="3" fill="#64748b"/>
        
        <!-- Arms locked -->
        <line x1="50" y1="88" x2="60" y2="35" stroke="#f87171" stroke-width="5" stroke-linecap="round"/>
        
        <!-- Head high (craning neck) -->
        <circle cx="35" cy="12" r="10" fill="#ef4444"/>
        
        <!-- Curved sagging spine (Red curve) -->
        <path d="M 45 25 Q 160 85 310 88" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
        
        <text x="135" y="55" fill="#f87171" font-family="sans-serif" font-size="9" font-weight="700">Lumbar Sag (Core Leak)</text>
      </g>

      <g transform="translate(16, 160)">
        <text x="0" y="10" fill="#fca5a5" font-family="sans-serif" font-size="10.5">· Sagging pelvis cuts chest activation by ~40%</text>
        <text x="0" y="28" fill="#fca5a5" font-family="sans-serif" font-size="10.5">· Creates excessive anterior shear stress on L4/L5 lumbar spine</text>
        <text x="0" y="46" fill="#fca5a5" font-family="sans-serif" font-size="10.5">· Craned neck causes cervical compression and scapular winging</text>
      </g>
    </g>
  </g>
</svg>
