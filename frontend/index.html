<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CalistheniX — Aesthetic Calisthenics Progression & Workout Tracker</title>
  <meta name="description" content="Local-first calisthenics progression tracker and live workout runner for isometric holds, tempo, progressive overload, and training consistency." />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CalistheniX" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app-layout">
    <!-- Desktop Sidebar (Widescreen >= 1024px) -->
    <aside class="app-sidebar desktop-sidebar">
      <div class="sidebar-top">
        <a href="#home" class="app-logo-link" style="text-decoration:none;">
          <span class="app-logo">Calisthen<span class="logo-x">i</span>X</span>
        </a>
        <span id="sync-status-pill" class="sync-pill sync-pill-synced" title="Data persistence & sync status">
          <span class="sync-dot"></span>
          <span id="sync-status-text">Synced</span>
        </span>
      </div>

      <nav class="sidebar-nav">
        <a href="#home" class="sidebar-nav-item" data-view="home">
          <span class="sidebar-nav-icon">
            <svg class="cx-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          </span>
          <span class="sidebar-nav-text">Home</span>
        </a>
        <a href="#workout" class="sidebar-nav-item" data-view="workout">
          <span class="sidebar-nav-icon">
            <svg class="cx-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          </span>
          <span class="sidebar-nav-text">Workout</span>
        </a>
        <a href="#split" class="sidebar-nav-item" data-view="split">
          <span class="sidebar-nav-icon">
            <svg class="cx-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
          </span>
          <span class="sidebar-nav-text">My Split</span>
        </a>
        <a href="#history" class="sidebar-nav-item" data-view="history_list">
          <span class="sidebar-nav-icon">
            <svg class="cx-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </span>
          <span class="sidebar-nav-text">History</span>
        </a>
        <a href="#progress" class="sidebar-nav-item" data-view="progress">
          <span class="sidebar-nav-icon">
            <svg class="cx-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
          </span>
          <span class="sidebar-nav-text">Progress</span>
        </a>
        <a href="#prs" class="sidebar-nav-item" data-view="prs" onclick="switchView('prs')">
          <span class="sidebar-nav-icon">
            <svg class="cx-icon cx-icon-gold" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.45 1-1 1H8c-.55 0-1 .45-1 1v1c0 .55.45 1 1 1h8c.55 0 1-.45 1-1v-1c0-.55-.45-1-1-1h-1c-.55 0-1-.45-1-1v-2.34"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
          </span>
          <span class="sidebar-nav-text">PRs</span>
        </a>
        <a href="#calendar" class="sidebar-nav-item" data-view="calendar" onclick="switchView('calendar')">
          <span class="sidebar-nav-icon">
            <svg class="cx-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>
          </span>
          <span class="sidebar-nav-text">Calendar</span>
        </a>

        <!-- Cyber Calisthenics Decorative Visual -->
        <div class="sidebar-visual-wrap">
          <img src="assets/sidebar_dumbbell.jpg" alt="CalistheniX" class="sidebar-visual-img" />
          <div class="sidebar-visual-overlay"></div>
        </div>

        <div class="sidebar-divider"></div>
        <button class="sidebar-nav-item sidebar-settings-btn" onclick="openSettingsModal()" title="Settings & Data">
          <span class="sidebar-nav-icon">
            <svg class="cx-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          </span>
          <span class="sidebar-nav-text">Settings</span>
        </button>
      </nav>

      <div class="sidebar-bottom">
        <div class="sidebar-athlete-card" onclick="openSettingsModal()" title="Athlete Profile & Settings">
          <img src="assets/avatar.jpg" alt="Sandeep" class="sidebar-avatar" onerror="this.style.display='none'" />
          <div class="sidebar-athlete-info">
            <span class="sidebar-athlete-name">Sandeep</span>
            <span class="sidebar-athlete-badge">
              <svg class="cx-icon cx-icon-xs cx-icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
              Level Beast
            </span>
            <span class="sidebar-athlete-streak" id="sidebar-streak-val">
              <svg class="cx-icon cx-icon-fire cx-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3z"/></svg>
              <span>12 day streak</span>
            </span>
          </div>
        </div>
      </div>
    </aside>

    <div class="app-content-wrap">
      <!-- Mobile Top Header (< 1024px) -->
      <header class="app-header mobile-header">
        <div style="display:flex; align-items:center; gap:10px;">
          <a href="#home" class="app-logo-link" style="text-decoration:none;">
            <span class="app-logo">Calisthen<span class="logo-x">i</span>X</span>
          </a>
          <span id="sync-status-pill-mobile" class="sync-pill sync-pill-synced" title="Sync Status">
            <span class="sync-dot"></span>
          </span>
        </div>
        <button class="nav-btn-icon" onclick="openSettingsModal()" title="Settings & Backup" aria-label="Settings">
          <svg class="cx-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </header>

      <main id="app-root" class="app-main"></main>
    </div>
  </div>

  <!-- Mobile Bottom Navigation (< 1024px) -->
  <nav class="app-bottom-nav mobile-nav">
    <a href="#home" class="bottom-nav-item" data-view="home">
      <span class="bottom-nav-icon">
        <svg class="cx-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </span>
      <span class="bottom-nav-label">Home</span>
    </a>
    <a href="#workout" class="bottom-nav-item bottom-nav-workout" data-view="workout">
      <span class="bottom-nav-icon">
        <svg class="cx-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </span>
      <span class="bottom-nav-label">Workout</span>
    </a>
    <a href="#split" class="bottom-nav-item" data-view="split">
      <span class="bottom-nav-icon">
        <svg class="cx-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
      </span>
      <span class="bottom-nav-label">Split</span>
    </a>
    <a href="#history" class="bottom-nav-item" data-view="history_list">
      <span class="bottom-nav-icon">
        <svg class="cx-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </span>
      <span class="bottom-nav-label">History</span>
    </a>
    <a href="#progress" class="bottom-nav-item" data-view="progress">
      <span class="bottom-nav-icon">
        <svg class="cx-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
      </span>
      <span class="bottom-nav-label">Progress</span>
    </a>
  </nav>

  <div id="settings-modal-root"></div>
  <div id="toast" class="toast toast-hidden"></div>

  <!-- Chart.js via CDN (architecture.md §5 — no build step) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
