    rel="stylesheet" />
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('cx_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        var accent = localStorage.getItem('cx_accent_color') || '#FF5D5D';
        document.documentElement.style.setProperty('--accent', accent);
        document.documentElement.style.setProperty('--phase-train', accent);
        document.documentElement.style.setProperty('--phase-accent', accent);
        var clean = accent.replace('#', '');
        var r, g, b;
        if (clean.length === 3) {
          r = parseInt(clean[0] + clean[0], 16);
          g = parseInt(clean[1] + clean[1], 16);
          b = parseInt(clean[2] + clean[2], 16);
        } else if (clean.length === 6) {
          r = parseInt(clean.substring(0, 2), 16);
          g = parseInt(clean.substring(2, 4), 16);
          b = parseInt(clean.substring(4, 6), 16);
        }
        if (!isNaN(r) && !isNaN(g) && !isNaN(b)) {
          var rgb = r + ', ' + g + ', ' + b;
          document.documentElement.style.setProperty('--phase-accent-rgb', rgb);
          document.documentElement.style.setProperty('--phase-train-rgb', rgb);
          document.documentElement.style.setProperty('--accent-dim', 'rgba(' + rgb + ', 0.12)');
          document.documentElement.style.setProperty('--accent-surface', 'rgba(' + rgb + ', 0.08)');
          document.documentElement.style.setProperty('--accent-ring', 'rgba(' + rgb + ', 0.25)');
          document.documentElement.style.setProperty('--accent-glow', '0 0 20px rgba(' + rgb + ', 0.22)');
          document.documentElement.style.setProperty('--border-accent', 'rgba(' + rgb + ', 0.3)');
          document.documentElement.style.setProperty('--phase-train-dim', 'rgba(' + rgb + ', 0.12)');
          document.documentElement.style.setProperty('--phase-train-border', 'rgba(' + rgb + ', 0.3)');
        }
      } catch (e) {}
    })();
  </script>
