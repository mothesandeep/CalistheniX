<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CalistheniX — Aesthetic Calisthenics Progression & Workout Tracker</title>
  <meta name="description" content="Local-first calisthenics progression tracker and live workout runner for isometric holds, tempo, progressive overload, and training consistency." />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CalistheniX" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="app-header">
    <span class="app-logo">Calisthen<span class="logo-x">i</span>X</span>
    <nav class="app-nav">
      <a href="#dashboard" class="nav-link" data-view="dashboard">Dashboard</a>
      <a href="#home"      class="nav-link" data-view="home">Today</a>
      <a href="#history"   class="nav-link" data-view="history_list">History</a>
      <a href="#routine"   class="nav-link" data-view="routine">Routine</a>
      <a href="#edit"      class="nav-link" data-view="edit">Edit</a>
    </nav>
  </header>

  <main id="app-root" class="app-main"></main>

  <div id="toast" class="toast toast-hidden"></div>

  <!-- Chart.js via CDN (architecture.md §5 — no build step) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
