<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="neonRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <circle cx="60" cy="60" r="58" fill="url(#avatarBg)" stroke="#2d3748" stroke-width="2"/>

  <!-- Outer Neon Ring -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="url(#neonRing)" stroke-width="2.5" filter="url(#glow)" opacity="0.9"/>

  <!-- Geometric Tech Grid Accents -->
  <circle cx="60" cy="60" r="48" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="4 6" opacity="0.3"/>
  <circle cx="60" cy="60" r="40" fill="none" stroke="#06b6d4" stroke-width="0.75" stroke-dasharray="2 8" opacity="0.25"/>

  <!-- Athletic Head Silhouette -->
  <circle cx="60" cy="42" r="16" fill="url(#bodyGrad)"/>

  <!-- Neck -->
  <path d="M 53 54 L 53 66 L 67 66 L 67 54 Z" fill="url(#bodyGrad)"/>

  <!-- Shoulders & Upper Torso (Athletic V-Shape) -->
  <path d="M 60 67 C 46 67 28 73 24 86 C 22 93 25 106 25 108 C 34 114 48 118 60 118 C 72 118 86 114 95 108 C 95 106 98 93 96 86 C 92 73 74 67 60 67 Z" fill="url(#bodyGrad)"/>

  <!-- Trap & Clavicle Muscle Contours -->
  <path d="M 45 68 Q 60 76 75 68" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M 52 56 Q 38 66 32 78" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 68 56 Q 82 66 88 78" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Chest Pectoral Line Definition -->
  <path d="M 60 78 L 60 102" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M 44 86 Q 52 92 60 92 Q 68 92 76 86" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>

  <!-- CalistheniX Core Emblem Crest -->
  <polygon points="60,78 64,84 60,88 56,84" fill="url(#accentGlow)"/>
</svg>
