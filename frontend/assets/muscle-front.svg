<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="100%" height="100%" class="cx-anatomical-svg front-view" role="img" aria-label="CalistheniX Human Muscle Silhouette Front View">
  <defs>
    <filter id="front-glow-primary" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#8b5cf6" flood-opacity="0.85" />
    </filter>
    <filter id="front-glow-secondary" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#f59e0b" flood-opacity="0.75" />
    </filter>
    <style>
      :root {
        --body-bg: #0f1118;
        --muscle-inactive: #232838;
        --muscle-inactive-stroke: #161924;
        --muscle-hover: #363d54;
        --accent: #8b5cf6;
        --accent-light: #c4b5fd;
        --accent-secondary: #f59e0b;
        --neutral-part: #1a1d28;
      }
      .cx-bg { fill: transparent; }
      .cx-body-outline { fill: var(--body-bg); opacity: 0.5; }
      .muscle {
        fill: var(--muscle-inactive);
        stroke: var(--muscle-inactive-stroke);
        stroke-width: 1.1px;
        stroke-linejoin: round;
        stroke-linecap: round;
        transition: fill 0.25s ease, stroke 0.25s ease, filter 0.25s ease, transform 0.25s ease;
        cursor: pointer;
      }
      .muscle:hover {
        fill: var(--muscle-hover);
        stroke: #485270;
      }
      .muscle.active, .muscle.is-primary, [data-active="primary"] {
        fill: var(--accent) !important;
        stroke: var(--accent-light) !important;
        stroke-width: 1.4px;
        filter: url(#front-glow-primary);
      }
      .muscle.is-secondary, [data-active="secondary"] {
        fill: var(--accent-secondary) !important;
        stroke: #fde68a !important;
        stroke-width: 1.2px;
        filter: url(#front-glow-secondary);
      }
      .neutral-joint {
        fill: var(--neutral-part);
        stroke: var(--muscle-inactive-stroke);
        stroke-width: 0.8px;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="200" height="400" class="cx-bg" />

  <!-- Base Body Underlay Reference -->
  <g class="cx-body-underlay">
    <ellipse cx="100" cy="30" rx="14" ry="17" class="cx-body-outline" />
  </g>

  <!-- 1. HEAD & NECK (Neutral Anatomical Anchor) -->
  <g id="head_neck" class="neutral-group">
    <ellipse id="head" cx="100" cy="30" rx="13" ry="16" class="neutral-joint" data-name="Head" />
    <path id="neck" d="M 93 45 L 107 45 L 109 54 L 91 54 Z" class="neutral-joint" data-name="Neck" />
  </g>

  <!-- 2. TRAPEZIUS (Anterior Clavicular) -->
  <g id="traps_group" class="muscle-group">
    <path id="traps" class="muscle traps upper_traps" data-muscle="traps" data-name="Trapezius (Upper)"
          d="M 91 50 L 100 53 L 109 50 L 118 59 L 109 62 L 100 63 L 91 62 L 82 59 Z" />
  </g>

  <!-- 3. SHOULDERS: FRONT & SIDE DELTOIDS -->
  <g id="shoulders_group" class="muscle-group">
    <!-- Left Front Deltoid -->
    <path id="front_delts_left" class="muscle front_delts shoulders" data-muscle="front_delts" data-name="Front Deltoid (Left)"
          d="M 80 60 C 72 61 64 67 60 77 C 57 84 59 91 65 94 C 68 90 73 81 77 74 C 80 68 81 63 80 60 Z" />
    <!-- Right Front Deltoid -->
    <path id="front_delts_right" class="muscle front_delts shoulders" data-muscle="front_delts" data-name="Front Deltoid (Right)"
          d="M 120 60 C 128 61 136 67 140 77 C 143 84 141 91 135 94 C 132 90 127 81 123 74 C 120 68 119 63 120 60 Z" />
    <!-- Left Side Deltoid -->
    <path id="side_delts_left" class="muscle side_delts shoulders" data-muscle="side_delts" data-name="Side Deltoid (Left)"
          d="M 60 77 C 52 83 48 93 50 102 C 53 105 57 105 61 101 C 58 95 56 86 60 77 Z" />
    <!-- Right Side Deltoid -->
    <path id="side_delts_right" class="muscle side_delts shoulders" data-muscle="side_delts" data-name="Side Deltoid (Right)"
          d="M 140 77 C 148 83 152 93 150 102 C 147 105 143 105 139 101 C 142 95 144 86 140 77 Z" />
  </g>

  <!-- 4. CHEST / PECTORALS -->
  <g id="chest_group" class="muscle-group">
    <!-- Left Pectoralis Major -->
    <path id="chest_left" class="muscle chest upper_chest lower_chest" data-muscle="chest" data-name="Pectorals (Left)"
          d="M 98 64 C 90 63 81 66 78 74 C 76 81 80 91 88 94 C 94 95 98 93 98 88 Z" />
    <!-- Right Pectoralis Major -->
    <path id="chest_right" class="muscle chest upper_chest lower_chest" data-muscle="chest" data-name="Pectorals (Right)"
          d="M 102 64 C 110 63 119 66 122 74 C 124 81 120 91 112 94 C 106 95 102 93 102 88 Z" />
  </g>

  <!-- 5. ARMS: BICEPS & FOREARMS -->
  <g id="arms_front_group" class="muscle-group">
    <!-- Left Biceps -->
    <path id="biceps_left" class="muscle biceps" data-muscle="biceps" data-name="Biceps (Left)"
          d="M 65 95 C 59 98 57 109 59 118 C 62 121 67 122 71 116 C 73 110 72 101 65 95 Z" />
    <!-- Right Biceps -->
    <path id="biceps_right" class="muscle biceps" data-muscle="biceps" data-name="Biceps (Right)"
          d="M 135 95 C 141 98 143 109 141 118 C 138 121 133 122 129 116 C 127 110 128 101 135 95 Z" />
    <!-- Left Forearm (Flexors) -->
    <path id="forearms_left" class="muscle forearms" data-muscle="forearms" data-name="Forearm (Left)"
          d="M 58 122 C 52 126 47 138 44 151 C 43 158 47 162 52 160 C 56 154 62 141 64 130 C 64 124 61 121 58 122 Z" />
    <!-- Right Forearm (Flexors) -->
    <path id="forearms_right" class="muscle forearms" data-muscle="forearms" data-name="Forearm (Right)"
          d="M 142 122 C 148 126 153 138 156 151 C 157 158 153 162 148 160 C 144 154 138 141 136 130 C 136 124 139 121 142 122 Z" />
  </g>

  <!-- HANDS (Neutral) -->
  <g id="hands_front" class="neutral-group">
    <path id="hand_left" d="M 43 161 C 38 166 33 174 30 182 C 29 186 33 188 36 184 C 40 178 45 172 47 166 Z" class="neutral-joint" data-name="Hand (Left)" />
    <path id="hand_right" d="M 157 161 C 162 166 167 174 170 182 C 171 186 167 188 164 184 C 160 178 155 172 153 166 Z" class="neutral-joint" data-name="Hand (Right)" />
  </g>

  <!-- 6. ABDOMINALS (6-Pack Rectus Abdominis) -->
  <g id="abs_group" class="muscle-group">
    <!-- Upper Abs -->
    <path id="abs_upper_left" class="muscle abs core" data-muscle="abs" data-name="Upper Abs (Left)"
          d="M 91 96 L 98 95 L 98 106 L 91 106 Z" />
    <path id="abs_upper_right" class="muscle abs core" data-muscle="abs" data-name="Upper Abs (Right)"
          d="M 102 95 L 109 96 L 109 106 L 102 106 Z" />
    <!-- Mid Abs -->
    <path id="abs_mid_left" class="muscle abs core" data-muscle="abs" data-name="Mid Abs (Left)"
          d="M 91 108 L 98 108 L 98 120 L 91 119 Z" />
    <path id="abs_mid_right" class="muscle abs core" data-muscle="abs" data-name="Mid Abs (Right)"
          d="M 102 108 L 109 108 L 109 119 L 102 120 Z" />
    <!-- Lower Abs -->
    <path id="abs_lower_left" class="muscle abs core" data-muscle="abs" data-name="Lower Abs (Left)"
          d="M 92 122 L 98 122 L 98 135 L 93 132 Z" />
    <path id="abs_lower_right" class="muscle abs core" data-muscle="abs" data-name="Lower Abs (Right)"
          d="M 102 122 L 108 122 L 107 132 L 102 135 Z" />
  </g>

  <!-- 7. OBLIQUES (Side Core & Serratus) -->
  <g id="obliques_group" class="muscle-group">
    <!-- Left Obliques -->
    <path id="obliques_left" class="muscle obliques core" data-muscle="obliques" data-name="Obliques (Left)"
          d="M 88 96 C 82 99 78 110 77 121 C 77 129 81 140 90 144 C 89 137 88 127 88 119 C 88 110 89 102 88 96 Z" />
    <!-- Right Obliques -->
    <path id="obliques_right" class="muscle obliques core" data-muscle="obliques" data-name="Obliques (Right)"
          d="M 112 96 C 118 99 122 110 123 121 C 123 129 119 140 110 144 C 111 137 112 127 112 119 C 112 110 111 102 112 96 Z" />
    <!-- Pelvic Floor / Deep Core Center -->
    <path id="core_pelvic" class="muscle core" data-muscle="core" data-name="Pelvic Core"
          d="M 92 137 L 100 151 L 108 137 C 102 140 98 140 92 137 Z" />
  </g>

  <!-- 8. LEGS: QUADRICEPS (Front Thighs) -->
  <g id="quads_group" class="muscle-group">
    <!-- Left Quad (Lateral & Rectus Femoris) -->
    <path id="quads_left_lateral" class="muscle quads legs" data-muscle="quads" data-name="Quads Lateral (Left)"
          d="M 89 147 C 80 155 73 169 70 187 C 67 202 70 217 77 224 C 82 223 87 209 89 195 C 91 181 92 162 89 147 Z" />
    <path id="quads_left_medial" class="muscle quads legs" data-muscle="quads" data-name="Quads Teardrop (Left)"
          d="M 90 152 C 92 167 92 185 90 203 C 89 215 92 223 95 221 C 97 212 98 192 97 172 C 96 157 93 151 90 152 Z" />
    <!-- Right Quad (Lateral & Rectus Femoris) -->
    <path id="quads_right_lateral" class="muscle quads legs" data-muscle="quads" data-name="Quads Lateral (Right)"
          d="M 111 147 C 120 155 127 169 130 187 C 133 202 130 217 123 224 C 118 223 113 209 111 195 C 109 181 108 162 111 147 Z" />
    <path id="quads_right_medial" class="muscle quads legs" data-muscle="quads" data-name="Quads Teardrop (Right)"
          d="M 110 152 C 108 167 108 185 110 203 C 111 215 108 223 105 221 C 103 212 102 192 103 172 C 104 157 107 151 110 152 Z" />
  </g>

  <!-- KNEES (Neutral) -->
  <g id="knees_front" class="neutral-group">
    <circle id="knee_left" cx="82" cy="229" r="4.5" class="neutral-joint" data-name="Knee (Left)" />
    <circle id="knee_right" cx="118" cy="229" r="4.5" class="neutral-joint" data-name="Knee (Right)" />
  </g>

  <!-- 9. SHINS & CALVES / TIBIALIS -->
  <g id="calves_front_group" class="muscle-group">
    <!-- Left Shin & Front Calf -->
    <path id="calves_front_left" class="muscle calves tibialis legs" data-muscle="calves" data-name="Calves / Tibialis (Left)"
          d="M 78 235 C 73 245 72 262 74 277 C 76 287 80 295 82 300 C 84 292 86 277 86 261 C 85 249 83 239 78 235 Z" />
    <!-- Right Shin & Front Calf -->
    <path id="calves_front_right" class="muscle calves tibialis legs" data-muscle="calves" data-name="Calves / Tibialis (Right)"
          d="M 122 235 C 127 245 128 262 126 277 C 124 287 120 295 118 300 C 116 292 114 277 114 261 C 115 249 117 239 122 235 Z" />
  </g>

  <!-- FEET (Neutral) -->
  <g id="feet_front" class="neutral-group">
    <path id="foot_left" d="M 80 302 C 77 309 74 317 72 323 C 76 324 84 324 87 321 C 88 315 86 305 84 302 Z" class="neutral-joint" data-name="Foot (Left)" />
    <path id="foot_right" d="M 120 302 C 123 309 126 317 128 323 C 124 324 116 324 113 321 C 112 315 114 305 116 302 Z" class="neutral-joint" data-name="Foot (Right)" />
  </g>
</svg>
