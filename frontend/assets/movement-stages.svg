<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e111a"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1f2e"/>
      <stop offset="100%" stop-color="#121520"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="accentGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="840" height="460" rx="14" fill="url(#bgGrad)" stroke="#232838" stroke-width="1.5"/>

  <!-- Grid Pattern Overlay -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="840" y2="60"/>
    <line x1="0" y1="160" x2="840" y2="160"/>
    <line x1="0" y1="260" x2="840" y2="260"/>
    <line x1="0" y1="360" x2="840" y2="360"/>
    <line x1="210" y1="0" x2="210" y2="460"/>
    <line x1="420" y1="0" x2="420" y2="460"/>
    <line x1="630" y1="0" x2="630" y2="460"/>
  </g>

  <!-- Diagram Header -->
  <text x="30" y="38" fill="#8b5cf6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5">CALISTHENICS BIOMECHANICS</text>
  <text x="30" y="58" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Movement Execution Stages &amp; Kinetic Path</text>

  <!-- ─── STAGE 1: Top Lockout (Plank Foundation) ─── -->
  <g transform="translate(25, 80)">
    <rect width="185" height="350" rx="10" fill="url(#cardGrad)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1.2" filter="url(#cardShadow)"/>
    
    <!-- Stage Pill -->
    <rect x="14" y="14" width="70" height="20" rx="10" fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6" stroke-width="1"/>
    <text x="49" y="28" fill="#c4b5fd" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">STAGE 01</text>
    
    <text x="14" y="52" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Top Lockout</text>
    <text x="14" y="68" fill="#94a3b8" font-family="sans-serif" font-size="10">Scapular Protraction</text>

    <!-- Figure Illustration: Top Plank -->
    <g transform="translate(15, 100)">
      <!-- Ground Line -->
      <line x1="0" y1="130" x2="155" y2="130" stroke="#334155" stroke-width="2" stroke-dasharray="3 3"/>
      
      <!-- Hands on ground -->
      <circle cx="35" cy="128" r="4" fill="#8b5cf6"/>
      <circle cx="140" cy="128" r="3" fill="#64748b"/>
      
      <!-- Arm vertical (locked out) -->
      <line x1="35" y1="128" x2="40" y2="70" stroke="#c4b5fd" stroke-width="5" stroke-linecap="round"/>
      
      <!-- Head -->
      <circle cx="20" cy="50" r="10" fill="#a78bfa"/>
      
      <!-- Torso & Rigid Plank Line -->
      <line x1="28" y1="58" x2="140" y2="128" stroke="#8b5cf6" stroke-width="7" stroke-linecap="round"/>
      
      <!-- Kinetic Spine Alignment Arrow -->
      <line x1="24" y1="46" x2="145" y2="122" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="2 2"/>
      
      <!-- Callout Badge -->
      <rect x="50" y="15" width="80" height="18" rx="4" fill="#0f172a" stroke="#06b6d4" stroke-width="0.8"/>
      <text x="90" y="27" fill="#38bdf8" font-family="sans-serif" font-size="8" font-weight="700" text-anchor="middle">180° Rigid Plank</text>
    </g>

    <!-- Bullet Points -->
    <g transform="translate(14, 255)">
      <circle cx="4" cy="6" r="2.5" fill="#8b5cf6"/>
      <text x="12" y="9" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">Push floor away</text>
      
      <circle cx="4" cy="24" r="2.5" fill="#8b5cf6"/>
      <text x="12" y="27" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">Glutes &amp; Core tight</text>
      
      <circle cx="4" cy="42" r="2.5" fill="#8b5cf6"/>
      <text x="12" y="45" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">Protracted scapula</text>

      <circle cx="4" cy="60" r="2.5" fill="#8b5cf6"/>
      <text x="12" y="63" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">Neutral neck gaze</text>
    </g>
  </g>

  <!-- ─── STAGE 2: Eccentric Descent (3-4s Control) ─── -->
  <g transform="translate(225, 80)">
    <rect width="185" height="350" rx="10" fill="url(#cardGrad)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1.2" filter="url(#cardShadow)"/>
    
    <!-- Stage Pill -->
    <rect x="14" y="14" width="70" height="20" rx="10" fill="rgba(6, 182, 212, 0.18)" stroke="#06b6d4" stroke-width="1"/>
    <text x="49" y="28" fill="#67e8f9" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">STAGE 02</text>
    
    <text x="14" y="52" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Eccentric Lowering</text>
    <text x="14" y="68" fill="#94a3b8" font-family="sans-serif" font-size="10">Elbows Tucked 45°</text>

    <!-- Figure Illustration: Mid-descent -->
    <g transform="translate(15, 100)">
      <!-- Ground Line -->
      <line x1="0" y1="130" x2="155" y2="130" stroke="#334155" stroke-width="2" stroke-dasharray="3 3"/>
      
      <!-- Hands & Toes -->
      <circle cx="35" cy="128" r="4" fill="#06b6d4"/>
      <circle cx="140" cy="128" r="3" fill="#64748b"/>
      
      <!-- Bent Arm (45 deg angle) -->
      <polyline points="35,128 55,95 42,75" fill="none" stroke="#67e8f9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Head -->
      <circle cx="20" cy="62" r="10" fill="#38bdf8"/>
      
      <!-- Torso descending -->
      <line x1="28" y1="70" x2="140" y2="128" stroke="#0284c7" stroke-width="7" stroke-linecap="round"/>
      
      <!-- Descent Arrow -->
      <path d="M 45 45 L 45 62 M 41 57 L 45 63 L 49 57" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Callout Badge -->
      <rect x="52" y="15" width="80" height="18" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="0.8"/>
      <text x="92" y="27" fill="#fbbf24" font-family="sans-serif" font-size="8" font-weight="700" text-anchor="middle">3–4s Controlled</text>
    </g>

    <!-- Bullet Points -->
    <g transform="translate(14, 255)">
      <circle cx="4" cy="6" r="2.5" fill="#06b6d4"/>
      <text x="12" y="9" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">45° Arm/Rib angle</text>
      
      <circle cx="4" cy="24" r="2.5" fill="#06b6d4"/>
      <text x="12" y="27" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">Inhale and brace core</text>
      
      <circle cx="4" cy="42" r="2.5" fill="#06b6d4"/>
      <text x="12" y="45" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">No hip sagging</text>

      <circle cx="4" cy="60" r="2.5" fill="#06b6d4"/>
      <text x="12" y="63" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">Retract scapulae</text>
    </g>
  </g>

  <!-- ─── STAGE 3: Bottom Hover & Stretch ─── -->
  <g transform="translate(425, 80)">
    <rect width="185" height="350" rx="10" fill="url(#cardGrad)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.2" filter="url(#cardShadow)"/>
    
    <!-- Stage Pill -->
    <rect x="14" y="14" width="70" height="20" rx="10" fill="rgba(245, 158, 11, 0.18)" stroke="#f59e0b" stroke-width="1"/>
    <text x="49" y="28" fill="#fde68a" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">STAGE 03</text>
    
    <text x="14" y="52" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Bottom Hover</text>
    <text x="14" y="68" fill="#94a3b8" font-family="sans-serif" font-size="10">Deep Chest Stretch</text>

    <!-- Figure Illustration: Deep Bottom Hover -->
    <g transform="translate(15, 100)">
      <!-- Ground Line -->
      <line x1="0" y1="130" x2="155" y2="130" stroke="#334155" stroke-width="2" stroke-dasharray="3 3"/>
      
      <!-- Hands & Toes -->
      <circle cx="35" cy="128" r="4" fill="#f59e0b"/>
      <circle cx="140" cy="128" r="3" fill="#64748b"/>
      
      <!-- Deep 90° Acute Elbow Flexion -->
      <polyline points="35,128 65,115 45,95" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Head close to floor -->
      <circle cx="20" cy="88" r="10" fill="#f59e0b"/>
      
      <!-- Torso 1-inch hover -->
      <line x1="28" y1="95" x2="140" y2="128" stroke="#d97706" stroke-width="7" stroke-linecap="round"/>
      
      <!-- 1-inch hover callout line -->
      <line x1="30" y1="126" x2="55" y2="126" stroke="#10b981" stroke-width="1.5"/>
      
      <!-- Callout Badge -->
      <rect x="52" y="15" width="80" height="18" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="0.8"/>
      <text x="92" y="27" fill="#4ade80" font-family="sans-serif" font-size="8" font-weight="700" text-anchor="middle">1s Hover Pause</text>
    </g>

    <!-- Bullet Points -->
    <g transform="translate(14, 255)">
      <circle cx="4" cy="6" r="2.5" fill="#f59e0b"/>
      <text x="12" y="9" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">Hover 1 inch off floor</text>
      
      <circle cx="4" cy="24" r="2.5" fill="#f59e0b"/>
      <text x="12" y="27" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">Peak hypertrophy TUT</text>
      
      <circle cx="4" cy="42" r="2.5" fill="#f59e0b"/>
      <text x="12" y="45" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">Full pectoral stretch</text>

      <circle cx="4" cy="60" r="2.5" fill="#f59e0b"/>
      <text x="12" y="63" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">Zero ground resting</text>
    </g>
  </g>

  <!-- ─── STAGE 4: Explosive Concentric Press ─── -->
  <g transform="translate(625, 80)">
    <rect width="185" height="350" rx="10" fill="url(#cardGrad)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.2" filter="url(#cardShadow)"/>
    
    <!-- Stage Pill -->
    <rect x="14" y="14" width="70" height="20" rx="10" fill="rgba(16, 185, 129, 0.18)" stroke="#10b981" stroke-width="1"/>
    <text x="49" y="28" fill="#a7f3d0" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">STAGE 04</text>
    
    <text x="14" y="52" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Concentric Drive</text>
    <text x="14" y="68" fill="#94a3b8" font-family="sans-serif" font-size="10">Explosive Power</text>

    <!-- Figure Illustration: Explosive Push -->
    <g transform="translate(15, 100)">
      <!-- Ground Line -->
      <line x1="0" y1="130" x2="155" y2="130" stroke="#334155" stroke-width="2" stroke-dasharray="3 3"/>
      
      <!-- Hands & Toes -->
      <circle cx="35" cy="128" r="4" fill="#10b981"/>
      <circle cx="140" cy="128" r="3" fill="#64748b"/>
      
      <!-- Straightening Arm with force lines -->
      <line x1="35" y1="128" x2="40" y2="72" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
      
      <!-- Head -->
      <circle cx="20" cy="52" r="10" fill="#10b981"/>
      
      <!-- Torso driving up -->
      <line x1="28" y1="60" x2="140" y2="128" stroke="#059669" stroke-width="7" stroke-linecap="round"/>
      
      <!-- Kinetic Upward Arrow -->
      <path d="M 50 85 L 50 62 M 46 68 L 50 60 L 54 68" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
      
      <!-- Callout Badge -->
      <rect x="52" y="15" width="80" height="18" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="0.8"/>
      <text x="92" y="27" fill="#6ee7b7" font-family="sans-serif" font-size="8" font-weight="700" text-anchor="middle">Explosive &lt;1s</text>
    </g>

    <!-- Bullet Points -->
    <g transform="translate(14, 255)">
      <circle cx="4" cy="6" r="2.5" fill="#10b981"/>
      <text x="12" y="9" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">Drive through palms</text>
      
      <circle cx="4" cy="24" r="2.5" fill="#10b981"/>
      <text x="12" y="27" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">Forceful exhalation</text>
      
      <circle cx="4" cy="42" r="2.5" fill="#10b981"/>
      <text x="12" y="45" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">Fast-twitch firing</text>

      <circle cx="4" cy="60" r="2.5" fill="#10b981"/>
      <text x="12" y="63" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">Return to lockout</text>
    </g>
  </g>
</svg>
