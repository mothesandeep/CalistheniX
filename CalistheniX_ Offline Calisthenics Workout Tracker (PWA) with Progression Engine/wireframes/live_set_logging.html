<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      height: 600px;
      width: 800px;
      overflow: hidden;
    }
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }
    header {
      padding: 16px;
      background: #1f1f1f;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .exercise-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #00e676;
    }
    .set-counter {
      font-size: 0.9rem;
      color: #888;
    }
    .logging-area {
      flex: 1;
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      overflow-y: auto;
    }
    .metric-card {
      background: #252525;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 1px solid #333;
    }
    .metric-label {
      font-size: 0.8rem;
      color: #aaa;
      text-transform: uppercase;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .metric-value-row {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .btn-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: #333;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .input-display {
      font-size: 2rem;
      font-weight: bold;
      color: #fff;
      min-width: 60px;
      text-align: center;
    }
    .tempo-box {
      background: #1a1a1a;
      padding: 8px 12px;
      border-radius: 4px;
      font-family: monospace;
      color: #00e676;
      font-size: 1.2rem;
    }
    .rpe-selector {
      grid-column: span 2;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .rpe-buttons {
      display: flex;
      justify-content: space-between;
      gap: 4px;
    }
    .rpe-btn {
      flex: 1;
      padding: 10px 0;
      background: #333;
      border: none;
      color: #fff;
      border-radius: 4px;
      font-size: 0.8rem;
    }
    .rpe-btn.active {
      background: #00e676;
      color: #000;
      font-weight: bold;
    }
    .action-footer {
      padding: 16px;
      background: #1f1f1f;
      display: flex;
      gap: 12px;
    }
    .btn-log {
      flex: 2;
      padding: 16px;
      background: #00e676;
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .btn-skip {
      flex: 1;
      padding: 16px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .pr-celebration {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 230, 118, 0.95);
      color: #000;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 100;
      display: block; /* Visible for wireframe demo */
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
    .confetti {
      font-size: 2rem;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- PR Celebration Overlay (Simulated) -->
    <div class="pr-celebration">
      <div class="confetti">🏆 🎉 ⚡</div>
      <h2 style="margin:0">NEW PERSONAL RECORD!</h2>
      <p style="margin:5px 0 0">Hold Duration: 15s (+3s)</p>
    </div>

    <header>
      <div>
        <div class="exercise-title">Straddle Planche Lean</div>
        <div class="set-counter">Main Phase • Set 2 of 4</div>
      </div>
      <div style="text-align:right">
        <div style="color:#888; font-size: 0.7rem;">PREVIOUS</div>
        <div style="font-weight:bold">12s • BW • RPE 8</div>
      </div>
    </header>

    <div class="logging-area">
      <!-- Reps -->
      <div class="metric-card">
        <div class="metric-label">Reps</div>
        <div class="metric-value-row">
          <button class="btn-circle">-</button>
          <div class="input-display">1</div>
          <button class="btn-circle">+</button>
        </div>
      </div>

      <!-- Hold Duration -->
      <div class="metric-card">
        <div class="metric-label">Hold (Secs)</div>
        <div class="metric-value-row">
          <button class="btn-circle">-</button>
          <div class="input-display">15</div>
          <button class="btn-circle">+</button>
        </div>
      </div>

      <!-- Weight -->
      <div class="metric-card">
        <div class="metric-label">Added Weight (kg)</div>
        <div class="metric-value-row">
          <button class="btn-circle">-</button>
          <div class="input-display">0</div>
          <button class="btn-circle">+</button>
        </div>
      </div>

      <!-- Tempo -->
      <div class="metric-card">
        <div class="metric-label">Tempo (E-I-C-P)</div>
        <div class="tempo-box">3 - 2 - 1 - 1</div>
      </div>

      <!-- RPE Selector -->
      <div class="rpe-selector">
        <div class="metric-label">RPE (Intensity 1-10)</div>
        <div class="rpe-buttons">
          <button class="rpe-btn">1</button>
          <button class="rpe-btn">2</button>
          <button class="rpe-btn">3</button>
          <button class="rpe-btn">4</button>
          <button class="rpe-btn">5</button>
          <button class="rpe-btn">6</button>
          <button class="rpe-btn">7</button>
          <button class="rpe-btn active">8</button>
          <button class="rpe-btn">9</button>
          <button class="rpe-btn">10</button>
        </div>
      </div>
    </div>

    <footer class="action-footer">
      <button class="btn-skip">SKIP SET</button>
      <button class="btn-log">LOG SET & START REST</button>
    </footer>
  </div>
</body>
</html>
